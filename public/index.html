<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>LazyFill</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="viewport">
    <div id="loadingSpinner"></div>
    <div id="brushGuide"></div>
    <div id="canvasContainer" style="position: absolute; top: 0; left: 0; transform-origin: 0 0;">
      <canvas id="canvasInput" style="display: block; z-index: 1;"></canvas>
      <canvas id="canvasOutput"
        style="position: absolute; top: 0; left: 0; visibility: hidden; pointer-events: none; z-index: 2;"></canvas>
      <canvas id="canvasMarker" style="position: absolute; top: 0; left: 0; cursor: crosshair; z-index: 3;"></canvas>
    </div>

    <div id="drop-message">
      <div>📂 ここに画像をドロップ</div>
      <div style="font-size: 1rem; margin-top: 10px;">(もしくはクリップボードからペースト)</div>
    </div>
  </div>

  <div id="panel-params" class="panel hidden">
    <h3>
      詳細設定
      <button id="btnCloseParams" class="panel-toggle-btn">×</button>
    </h3>

    <div class="row">
      <span>BB閾値 (Threshold)</span>
      <input type="number" id="inpBB" value="0.2" step="0.1">
    </div>
    <div class="row">
      <span>領域拡張 (Padding px)</span>
      <input type="number" id="inpPadding" value="1" step="1" min="0">
    </div>
    <div class="row">
      <span>平滑化 (Sigma)</span>
      <input type="number" id="inpSigma" value="0.3" step="0.01">
    </div>
    <div class="row">
      <span>最大反復回数 (Max Iter)</span>
      <input type="number" id="inpMaxIter" value="5000" step="100">
    </div>
    <div class="row">
      <span>探索頻度 (BFS Num)</span>
      <input type="number" id="inpBfsNum" value="10" step="1">
    </div>
    <div class="row">
      <span>エッジ強度 (Strength)</span>
      <input type="number" id="inpStrength" value="0.95" step="0.05">
    </div>

    <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">

    <div class="row">
      <span>ホイール感度 (%)</span>
      <input type="number" id="inpZoomStep" value="10" min="1" max="100" step="1">
    </div>
  </div>

  <div id="panel-tools" class="panel">
    <h3>ツール & パレット</h3>

    <button id="btnRun" class="btn-large-action btn-primary" style="margin-bottom: 15px; font-size: 1.2rem;">
      グラフカット実行
    </button>

    <div style="margin-bottom: 10px;">
      <label style="cursor: pointer; user-select: none; font-weight: bold;">
        <input type="checkbox" id="chkDynamic" checked>
        自動更新
      </label>
    </div>

    <div style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
      <div style="display: flex; gap: 15px;">
        <label style="margin: 0; cursor: pointer; user-select: none; font-weight: bold;">
          <input type="checkbox" id="chkShowMarker">
          マーカーを表示
        </label>
      </div>

      <button id="btnAutoMark" class="btn-large-action btn-prominent" style="margin-bottom: 15px;">
        自動マークを実行
      </button>
    </div>

    <div class="tool-group">
      <label class="tool-btn-label">
        <input type="radio" name="toolMode" value="brush" checked> 🖌 ブラシ
      </label>
      <label class="tool-btn-label">
        <input type="radio" name="toolMode" value="eraser"> 🧹 消しゴム
      </label>
      <label class="tool-btn-label">
        <input type="radio" name="toolMode" value="move"> ✋ カメラ移動
      </label>
    </div>

    <div style="margin: 0 0 15px 0;">
      <div class="row">
        <span>ブラシサイズ: <strong id="dispBrushSize">2</strong>px</span>
      </div>
      <input type="range" id="inpBrushSize" min="1" max="50" value="2">
    </div>

    <div class="color-row">
      <input type="color" id="colorPicker" value="#0000ff">
      <div style="display: flex; flex-direction: column; flex: 1;">
        <span id="currentLabelName" style="font-weight: bold; font-size: 1.1rem;">色2</span>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 5px;">
          <span style="font-size: 0.9rem;">透明度:</span>
          <input type="number" id="alphaInput" value="1.0" step="0.1" min="0.1" max="1.0" style="width: 60px;">
        </div>
      </div>
    </div>

    <div id="paletteContainer">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="btnAddLabel" class="btn-large-action" style="flex: 2;">+ 追加</button>
      <button id="btnDeleteLabel" class="btn-large-action" style="flex: 1;" disabled>- 削除</button>
    </div>
  </div>

  <div id="status-bar">
    <div class="status-group">
      <span title="現在のズーム倍率">🔍 Zoom:</span>
      <input type="number" id="inpZoomLevel" value="100" min="10" max="10000" step="10">
      <span>%</span>
    </div>
  </div>

  <input type="file" id="inpLoad" style="display:none" accept="image/*,.json">
  <script type="module" src="./main.js"></script>
</body>

</html>
